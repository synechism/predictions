[build-system]
requires = ["setuptools>=64", "wheel", "torch>=2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "predictions"
version = "0.0.1"
description = "Realtime diffusion with custom CUDA kernels"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ninja",
]

[tool.setuptools]
packages = ["predictions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
